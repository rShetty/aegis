name: Temp:ops task on VPS

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:hostinger

      - name: Install forge nginx vhost from synced /opt checkout
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/forge
            git fetch origin main
            git reset --hard origin/main
            if [ -f deploy/nginx-vhost.conf ] && [ -d /etc/nginx/sites-available ]; then
              install -m 644 deploy/nginx-vhost.conf /etc/nginx/sites-available/forge.conf
              ln -sf /etc/nginx/sites-available/forge.conf /etc/nginx/sites-enabled/forge.conf
              if nginx -t 2>/tmp/nginx-test.log; then
                systemctl reload nginx
                echo "nginx vhost installed and reloaded"
              else
                echo "WARNING: nginx -t failed; vhost staged but NOT reloaded:" >&2
                cat /tmp/nginx-test.log >&2
              fi
            fi
            systemctl is-active forge
            curl -sf http://127.0.0.1:8788/health && echo " forge healthy"


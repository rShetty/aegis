name: Deploy Aegis

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aegis-production
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: |
          rustup update stable
          rustup component add rustfmt clippy

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        run: |
          rustup update stable
          rustup component add rustfmt clippy
      - name: Install security tooling
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked
      - name: Cargo audit
        run: cargo audit
      - name: Cargo deny
        run: cargo deny check advisories bans licenses sources
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: 1

  deploy:
    needs: [verify, security]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Connect to tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:hostinger
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 300s
          command_timeout: 30m
          script: |
            set -euo pipefail

            if [ ! -d /opt/aegis/.git ]; then
              rm -rf /opt/aegis
              git clone https://github.com/rShetty/Aegis.git /opt/aegis
            fi

            cd /opt/aegis
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            # Ensure config and env directories
            mkdir -p /etc/aegis
            if [ ! -f /etc/aegis/aegis.env ]; then
              echo "RUST_LOG=info" > /etc/aegis/aegis.env
            fi
            chmod 600 /etc/aegis/aegis.env

            # Copy config
            cp config/aegis.toml /etc/aegis/aegis.toml

            # Provision admin token once (required by release builds)
            touch /etc/aegis/aegis.env && chmod 600 /etc/aegis/aegis.env
            grep -q "^AEGIS_ADMIN_TOKEN=" /etc/aegis/aegis.env || \
              echo "AEGIS_ADMIN_TOKEN=$(openssl rand -hex 32)" >> /etc/aegis/aegis.env

            # Build
            source "$HOME/.cargo/env"
            cargo build --release

            # Install binary
            install -m 755 target/release/aegis /usr/local/bin/aegis

            # Ensure user and data directory
            id aegis >/dev/null 2>&1 || useradd --system --home-dir /var/lib/aegis --create-home --shell /usr/sbin/nologin aegis
            mkdir -p /var/lib/aegis
            chown aegis:aegis /var/lib/aegis

            # Install systemd unit
            cp deploy/aegis.service /etc/systemd/system/aegis.service
            systemctl daemon-reload
            systemctl enable aegis
            systemctl restart aegis

            # ── Production cutover: tailnet-only nginx vhost ──────────
            # No operator UI; whole vhost is tailnet-only
            # (see deploy/nginx-vhost.conf).
            if [ -f deploy/nginx-vhost.conf ] && [ -d /etc/nginx/sites-available ]; then
              install -m 644 deploy/nginx-vhost.conf /etc/nginx/sites-available/aegis.conf
              ln -sf /etc/nginx/sites-available/aegis.conf /etc/nginx/sites-enabled/aegis.conf
              if nginx -t 2>/tmp/nginx-test.log; then
                systemctl reload nginx
                echo "nginx vhost installed and reloaded"
              else
                echo "WARNING: nginx -t failed; vhost staged but NOT reloaded:" >&2
                cat /tmp/nginx-test.log >&2 || true
              fi
            fi

            # Health check with retries
            sleep 5
            for i in 1 2 3 4 5; do
              if curl -sf http://127.0.0.1:8686/health; then
                echo ""
                echo "DEPLOY SUCCESS: aegis is healthy"
                exit 0
              fi
              echo "Health check attempt $i failed, waiting..."
              sleep 5
            done

            echo "ERROR: Health check failed"
            journalctl -u aegis -n 30 --no-pager
            exit 1

      - name: Retry deploy (1)
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 300s
          command_timeout: 30m
          script: |
            set -euo pipefail
            source "$HOME/.cargo/env"
            cd /opt/aegis
            git fetch origin main
            git reset --hard origin/main
            cargo build --release
            install -m 755 target/release/aegis /usr/local/bin/aegis
            cp config/aegis.toml /etc/aegis/aegis.toml
            cp deploy/aegis.service /etc/systemd/system/aegis.service
            systemctl daemon-reload
            systemctl restart aegis
            sleep 5
            curl -sf http://127.0.0.1:8686/health && echo "DEPLOY SUCCESS (retry 1)" || (journalctl -u aegis -n 20 --no-pager && exit 1)

      - name: Retry deploy (2)
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 300s
          command_timeout: 30m
          script: |
            set -euo pipefail
            source "$HOME/.cargo/env"
            cd /opt/aegis
            systemctl restart aegis
            sleep 5
            curl -sf http://127.0.0.1:8686/health && echo "DEPLOY SUCCESS (retry 2)" || (journalctl -u aegis -n 20 --no-pager && exit 1)

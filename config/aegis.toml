[server]
host = "127.0.0.1"
port = 8686
# Exact origins allowed to call the API from a browser. Empty = no CORS.
cors_allowed_origins = []
# Proxies trusted to set X-Forwarded-For on behalf of clients (#7).
# Exact IPs or CIDR ranges. Empty = XFF never honored; source_ip in
# egress_log is always the direct socket peer.
trusted_proxies = []

[database]
path = "/var/lib/aegis/aegis.db"

[egress]
default_policy = "deny"
max_request_size_bytes = 10485760
max_connections_per_agent = 20
bandwidth_limit_kbps = 10240
# Audit rows in egress_log older than this are pruned automatically (#10).
log_retention_days = 30

[attestation]
enabled = true
require_attestation = false

[geo]
enabled = false
blocked_regions = []
